# ══════════════════════════════════════════════════════════════
#  SNS 오토파일럿 설정
#  node src/cli.js run --config config/pipeline.yaml
# ══════════════════════════════════════════════════════════════

brand:
  name: "마이리얼트립"
  # 문구 톤. 여기 적은 대로 카피가 생성됩니다.
  voice: "여행 준비하는 20~30대에게 말 걸듯, 과장 없이 구체적인 숫자와 혜택 중심으로. 존댓말 반말 섞지 말고 해요체."
  # 절대 쓰면 안 되는 표현 (과장광고/법적 리스크 차단)
  banned: ["최저가 보장", "무조건", "100% 환불", "국내 유일"]
  cta: "프로필 링크에서 쿠폰 받기"
  # 영상 첫 화면 위쪽에 넣을 작은 배지. 비워두면 아무것도 안 나옵니다.
  badge: ""
  colors:
    bg: "#0B3D91"
    accent: "#4FC3F7"
    text: "#FFFFFF"
    highlight: "#FFD54F"

# ── 1) 홈페이지 자동 조작 & 화면 녹화 ────────────────────────
capture:
  # 처음엔 데모로 맞춰져 있습니다. 내 사이트로 바꿀 때
  # config/flows/example-homepage.yaml 을 복사해 고친 뒤 여기 경로만 바꾸세요.
  flow: config/flows/demo.yaml

# ── 2) 숏츠 / GIF 렌더 ───────────────────────────────────────
render:
  shorts:
    width: 1080
    height: 1920
    fps: 30
    # 녹화가 이보다 길면 배속으로 줄입니다 (숏츠는 짧을수록 완주율이 높음)
    maxDuration: 28
    speed: auto        # auto | 1 | 1.5 | 2 ...
    introSeconds: 1.6
    outroSeconds: 2.0
    bgm: ""            # assets/bgm.mp3 처럼 경로를 넣으면 배경음이 깔립니다
  gif:
    width: 640
    fps: 12
    maxDuration: 8

# ── 3) 블로그 분석 ───────────────────────────────────────────
blog:
  # feed 를 주면 최신 글을 자동으로 가져옵니다. urls 를 주면 그 글만 봅니다.
  feed: ""                     # 예: https://blog.example.com/rss
  urls: []                     # 예: ["https://blog.example.com/post/1"]
  limit: 3
  # 이미 처리한 글은 건너뜁니다
  stateFile: .state/seen.json

# ── 4) 카피 생성 ─────────────────────────────────────────────
copy:
  model: claude-opus-5
  effort: high
  platforms: [instagram, threads, x, youtube, naver_blog]
  variants: 2                  # 플랫폼별 A/B 시안 개수
  language: ko

# ── 5) 이미지 카드 생성 ──────────────────────────────────────
image:
  template: templates/card.html
  sizes:
    - { name: feed,  width: 1080, height: 1350 }
    - { name: story, width: 1080, height: 1920 }
    - { name: og,    width: 1200, height: 630  }

# ── 6) 발행 ──────────────────────────────────────────────────
publish:
  # 기본은 dry-run 입니다. 실제로 올리려면 CLI 에 --publish 를 붙이세요.
  targets: [file]              # file | webhook | postiz | x | threads | instagram | youtube
  # 예약 발행 (postiz 만 지원). 비우면 즉시 발행.
  scheduleAt: ""
