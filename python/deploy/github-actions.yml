# .github/workflows/ 에 복사해서 쓰세요.
name: SNS 자동 발행

on:
  schedule:
    # 매일 오전 9시(KST) = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "분석할 블로그 글 주소 (비우면 설정의 feed 사용)"
        required: false
      publish:
        description: "실제로 발행할지 여부"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: 파이프라인 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTIZ_API_URL: ${{ secrets.POSTIZ_API_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          POSTIZ_INTEGRATIONS: ${{ secrets.POSTIZ_INTEGRATIONS }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SITE_ID: ${{ secrets.SITE_ID }}
          SITE_PW: ${{ secrets.SITE_PW }}
        run: |
          python -m sns_autopilot run \
            ${{ inputs.url && format('--url {0}', inputs.url) || '' }} \
            ${{ (inputs.publish || github.event_name == 'schedule') && '--publish' || '' }}

      - name: 결과물 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-out
          path: |
            python/out/**/render/*.mp4
            python/out/**/render/*.gif
            python/out/**/images/*.png
            python/out/**/copy/*.json
            python/out/**/queue/*
            python/out/**/publish-report.json
          retention-days: 14

      # 중복 발행 방지용 처리 기록을 저장소에 남깁니다.
      - name: 처리 기록 커밋
        if: success() && github.event_name == 'schedule'
        run: |
          if [ -f .state/seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .state/seen.json
            git diff --staged --quiet || { git commit -m "chore: 발행 완료 글 기록 갱신"; git push; }
          fi
